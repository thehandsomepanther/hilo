<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Equation Hi-Lo app icon.  The two numbers a player builds equations toward
    are 20 (high) and 1 (low), stacked across a divider so the mark reads as
    the split pot.  Gold and silver are two of the deck's four suits.
  -->
  <rect width="512" height="512" rx="112" fill="#14141c" />
  <rect x="8" y="8" width="496" height="496" rx="105" fill="none" stroke="#e8b923" stroke-opacity="0.18" stroke-width="4" />
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="256" y="212" font-size="196" fill="#e8b923">20</text>
    <!-- Optically centred: Helvetica's "1" carries a wide left side bearing. -->
    <text x="246" y="438" font-size="196" fill="#f2f2f7">1</text>
  </g>
  <rect x="112" y="242" width="288" height="16" rx="8" fill="#b87333" />
</svg>
